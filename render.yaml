services:
  - type: web
    name: devsprint-web
    runtime: static
    buildCommand: cd website && npm ci && npm run check
    staticPublishPath: website/dist
    envVars:
      # Render's default service hostname is devsprint-web.onrender.com.
      # This is public configuration, not a secret.
      - key: VITE_API_URL
        value: https://devsprint-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: devsprint-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: true
      - key: DB_CONNECTION_LIMIT
        value: 5
      - key: DATABASE_URL
        sync: false
      # Render generates a private 256-bit secret automatically.
      - key: JWT_SECRET
        generateValue: true
      # Keep this in sync with the public URL of the static frontend.
      - key: CORS_ORIGIN
        value: https://devsprint-web.onrender.com
      # Generated automatically. Copy it privately into the Payhip webhook URL.
      - key: PAYHIP_WEBHOOK_SECRET
        generateValue: true
