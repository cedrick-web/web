services:
  - type: web
    name: devsprint-web
    runtime: static
    buildCommand: cd website && npm install && npm run check && npm run build
    staticPublishPath: website/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: devsprint-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: true
      - key: DB_CONNECTION_LIMIT
        value: 5
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PAYHIP_WEBHOOK_API_KEY
        sync: false
      - key: PAYHIP_PRODUCT_ID
        sync: false
