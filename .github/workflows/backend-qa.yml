name: DevSprint Backend QA

on:
  push:
    branches: ['**']
    paths:
      - 'server/**'
      - '.github/workflows/backend-qa.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'server/**'
      - '.github/workflows/backend-qa.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: node --check src/server.js && node --check src/auth.js && node --check src/db.js
