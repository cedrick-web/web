name: Build DevSprint V1 Customer Package

on:
  push:
    branches: ['devsprint-v1']
  pull_request:
    branches: ['devsprint-v1']
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install deterministic website dependencies
        working-directory: website
        run: npm ci

      - name: Run website, curriculum and package QA
        working-directory: website
        run: npm run check

      - name: Build customer ZIP and SHA-256 checksum
        working-directory: website
        run: npm run package

      - name: Verify checksum
        run: |
          cd products/javascript-toolkit/release
          sha256sum -c DEVSPRINT-JAVASCRIPT-PROBLEM-SOLVING-DSA-TOOLKIT-V1.zip.sha256

      - name: Upload customer ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: DevSprint-JavaScript-Problem-Solving-DSA-Toolkit-V1
          path: |
            products/javascript-toolkit/release/DEVSPRINT-JAVASCRIPT-PROBLEM-SOLVING-DSA-TOOLKIT-V1.zip
            products/javascript-toolkit/release/DEVSPRINT-JAVASCRIPT-PROBLEM-SOLVING-DSA-TOOLKIT-V1.zip.sha256
          if-no-files-found: error
          retention-days: 30
